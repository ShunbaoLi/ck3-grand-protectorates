 # --- Three Imperial Grand Protectorate Titles ---
 e_anxi_protectorate: "Anxi Grand Protectorate"
 e_anxi_protectorate_adj: "Anxi"
 e_andong_protectorate: "Andong Grand Protectorate"
 e_andong_protectorate_adj: "Andong"
 e_anbei_protectorate: "Anbei Grand Protectorate"
 e_anbei_protectorate_adj: "Anbei"

 # --- Decisions (Direct 1-Step without Submenus) ---
 establish_anxi_decision: "Establish Anxi Grand Protectorate"
 manage_anxi_decision: "Manage Anxi Grand Protectorate"
 establish_anxi_decision_desc: "Establish the Anxi Grand Protectorate in the Western Regions (De Jure Capital: Gaochang) to administer Central Asia and the Silk Road."
 manage_anxi_decision_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Anxi Grand Protectorate."
 establish_anxi_decision_tooltip: "Establish the Anxi Grand Protectorate and demarcate its frontier jurisdiction."
 manage_anxi_decision_tooltip: "Add or remove constituent kingdoms administered by the Anxi Grand Protectorate."
 open_anxi_management_window_tooltip: "Open the Anxi Grand Protectorate Management & Demarcation Panel"

 establish_andong_decision: "Establish Andong Grand Protectorate"
 manage_andong_decision: "Manage Andong Grand Protectorate"
 establish_andong_decision_desc: "Establish the Andong Grand Protectorate in the northeast (De Jure Capital: Shenyang) to administer Liaodong, Korea, and beyond."
 manage_andong_decision_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Andong Grand Protectorate."
 establish_andong_decision_tooltip: "Establish the Andong Grand Protectorate and demarcate its frontier jurisdiction."
 manage_andong_decision_tooltip: "Add or remove constituent kingdoms administered by the Andong Grand Protectorate."
 open_andong_management_window_tooltip: "Open the Andong Grand Protectorate Management & Demarcation Panel"

 establish_anbei_decision: "Establish Anbei Grand Protectorate"
 manage_anbei_decision: "Manage Anbei Grand Protectorate"
 establish_anbei_decision_desc: "Establish the Anbei Grand Protectorate on the northern steppe (De Jure Capital: Karakorum) to administer the steppe hordes and Siberia."
 manage_anbei_decision_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Anbei Grand Protectorate."
 establish_anbei_decision_tooltip: "Establish the Anbei Grand Protectorate and demarcate its frontier jurisdiction."
 manage_anbei_decision_tooltip: "Add or remove constituent kingdoms administered by the Anbei Grand Protectorate."
 open_anbei_management_window_tooltip: "Open the Anbei Grand Protectorate Management & Demarcation Panel"

 establish_decision_confirm: "Promulgate Edict"
 manage_decision_confirm: "Realign Jurisdiction"

 unlock_anxi_protectorate_trigger_desc: "Controls the County of Gaochang"
 unlock_andong_protectorate_trigger_desc: "Controls the County of Shenyang"
 unlock_anbei_protectorate_trigger_desc: "Controls the County of Karakorum"

 # --- Toasts & Notifications ---
 grand_protectorate_confirmed_toast_title: "Imperial Frontier Demarcated"
 grand_protectorate_confirmed_toast_desc: "The imperial edict realigning the Grand Protectorate has been enacted. De jure kingdom jurisdictions have shifted immediately!"
 grand_protectorate_decommissioned_toast_title: "Grand Protectorate Decommissioned"
 grand_protectorate_decommissioned_toast_desc: "As its jurisdiction was emptied, the Grand Protectorate has been dismantled. All former constituent kingdoms safely returned to their ancestral empires, and court prestige has been refunded."

 # --- GUI Windows & Widgets ---
 GRAND_PROTECTORATE_WINDOW_HEADER: "Grand Protectorate Chancellery · Jurisdiction Demarcation"
 GRAND_PROTECTORATE_PANEL_SUBHEADER: "Tier 5 Imperial Jurisdiction created by the Hegemon, governed via Protectorate Contract and Governor Succession"
 GRAND_PROTECTORATE_INSTRUCTIONS: "Check the kingdoms below to incorporate them into this Grand Protectorate. Leaving all boxes unchecked will decommission the title."
 GRAND_PROTECTORATE_NO_CANDIDATE_KINGDOMS: "No eligible candidate kingdoms found in your realm."
 GRAND_PROTECTORATE_CARD_SUBTITLE: "Ancestral Empire: [Title.MakeScope.Var('display_original_empire').Title.GetNameNoTooltip] · [Title.MakeScope.Var('de_jure_duchy_count').GetValue|0] Duchies"
 GRAND_PROTECTORATE_STATUS_ESTABLISHED: "[Current De Jure]"
 GRAND_PROTECTORATE_DECOMMISSION_WARNING: "⚠️ All jurisdictions cleared. This Grand Protectorate will be formally decommissioned."
 GRAND_PROTECTORATE_BUTTON_CANCEL: "Cancel"
 GRAND_PROTECTORATE_CONFIRM_BUTTON: "Enact Imperial Edict: Demarcate Frontier"
 GRAND_PROTECTORATE_CONFIRM_BUTTON_TT: "Assign all checked kingdoms to this Grand Protectorate's de jure empire. Any unchecked former kingdoms safely return to their ancestral mother empires."
