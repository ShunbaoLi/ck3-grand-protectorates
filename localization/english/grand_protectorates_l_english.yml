l_english:
 # ====================================================================
 # CK3 Grand Protectorates - English Localization
 # 天子敕建大都护府 - 英文本地化
 # ====================================================================

 # --- Three Imperial Grand Protectorate Titles ---
 e_anxi_protectorate: "Anxi Grand Protectorate"
 e_anxi_protectorate_adj: "Anxi"
 e_andong_protectorate: "Andong Grand Protectorate"
 e_andong_protectorate_adj: "Andong"
 e_anbei_protectorate: "Anbei Grand Protectorate"
 e_anbei_protectorate_adj: "Anbei"

 # --- Decisions (Unified Option-List Flow) ---
 establish_grand_protectorate_decision: "Imperial Edict: Grand Protectorate Affairs"
 establish_grand_protectorate_decision_desc: "The Grand Protectorates are paramount institutions through which the Son of Heaven pacifies distant frontiers, commands provincial armies, and governs tributary realms. In accordance with ancient precedent, we shall establish the Grand Protectorates of Anxi, Andong, and Anbei, applying protectorate provincial contracts and governor appointments to secure imperial hegemony. Established protectorates may also have their constituent kingdom jurisdictions realigned at will."
 establish_grand_protectorate_decision_tooltip: "Establish or realign Grand Protectorates"
 establish_grand_protectorate_decision_effect_tooltip: "Opens the Grand Protectorate Chancellery panel to demarcate constituent de jure kingdoms."

 ESTABLISH_GRAND_PROTECTORATE_NEXT_STEP_BUTTON: "Draft Imperial Edict"
 establish_decision_confirm: "Promulgate Imperial Edict"

 # Option List
 establish_anxi_option: "Establish Anxi Grand Protectorate"
 establish_anxi_option_desc: "Establish the Anxi Grand Protectorate in the Western Regions (De Jure Capital: Gaochang) to administer Central Asia and the Silk Road."
 establish_anxi_option_tooltip: "Establish the Anxi Grand Protectorate to govern the Western Regions, Transoxiana, and Central Asia."
 manage_anxi_option: "Manage Anxi Grand Protectorate"
 manage_anxi_option_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Anxi Grand Protectorate."
 manage_anxi_option_tooltip: "Realign the de jure kingdom jurisdictions of the Anxi Grand Protectorate."

 establish_andong_option: "Establish Andong Grand Protectorate"
 establish_andong_option_desc: "Establish the Andong Grand Protectorate in the northeast (De Jure Capital: Shenyang) to administer Liaodong, Korea, and beyond."
 establish_andong_option_tooltip: "Establish the Andong Grand Protectorate to govern Liaodong, Korea, and Japan."
 manage_andong_option: "Manage Andong Grand Protectorate"
 manage_andong_option_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Andong Grand Protectorate."
 manage_andong_option_tooltip: "Realign the de jure kingdom jurisdictions of the Andong Grand Protectorate."

 establish_anbei_option: "Establish Anbei Grand Protectorate"
 establish_anbei_option_desc: "Establish the Anbei Grand Protectorate on the northern steppe (De Jure Capital: Karakorum) to administer the steppe hordes and Siberia."
 establish_anbei_option_tooltip: "Establish the Anbei Grand Protectorate to govern the northern steppes and Siberia."
 manage_anbei_option: "Manage Anbei Grand Protectorate"
 manage_anbei_option_desc: "Survey and adjust the constituent kingdoms and de jure boundaries of the Anbei Grand Protectorate."
 manage_anbei_option_tooltip: "Realign the de jure kingdom jurisdictions of the Anbei Grand Protectorate."

 # County Hub Triggers
 unlock_anxi_protectorate_trigger_desc: "Controls the County of Gaochang"
 unlock_andong_protectorate_trigger_desc: "Controls the County of Shenyang"
 unlock_anbei_protectorate_trigger_desc: "Controls the County of Karakorum"

 # --- Toasts & Notifications ---
 grand_protectorate_opened_toast_title: "Imperial Decree: Protectorate Demarcation"
 grand_protectorate_opened_toast_desc: "The imperial decree has been promulgated. The Chancellery is now preparing the realignment of frontier kingdoms."
 grand_protectorate_confirmed_toast_title: "Imperial Frontier Demarcated"
 grand_protectorate_confirmed_toast_desc: "The imperial edict realigning the Grand Protectorate has been enacted. De jure kingdom jurisdictions have shifted immediately!"
 grand_protectorate_decommissioned_toast_title: "Grand Protectorate Decommissioned"
 grand_protectorate_decommissioned_toast_desc: "As its jurisdiction was emptied, the Grand Protectorate has been dismantled. All former constituent kingdoms safely returned to their ancestral empires, and court prestige has been refunded."

 # --- GUI Windows & Widgets ---
 GRAND_PROTECTORATE_WINDOW_HEADER: "Grand Protectorate Chancellery · Jurisdiction Demarcation"
 GRAND_PROTECTORATE_PANEL_SUBHEADER: "Tier 5 Imperial Jurisdiction created by the Hegemon, governed via Protectorate Contract and Governor Succession"
 GRAND_PROTECTORATE_INSTRUCTIONS: "Check the kingdoms below to incorporate them into this Grand Protectorate. Leaving all boxes unchecked will decommission the title."
 GRAND_PROTECTORATE_NO_CANDIDATE_KINGDOMS: "No eligible candidate kingdoms found in your realm."
 GRAND_PROTECTORATE_CARD_SUBTITLE: "Ancestral Empire: [Title.MakeScope.Var('display_original_empire').Title.GetNameNoTooltip] · [Title.MakeScope.Var('de_jure_duchy_count').GetValue|0] Duchies"
 GRAND_PROTECTORATE_STATUS_ESTABLISHED: "[Current De Jure]"
 GRAND_PROTECTORATE_DECOMMISSION_WARNING: "⚠️ All jurisdictions cleared. This Grand Protectorate will be formally decommissioned."
 GRAND_PROTECTORATE_BUTTON_CANCEL: "Cancel"
 GRAND_PROTECTORATE_CONFIRM_BUTTON: "Enact Imperial Edict: Demarcate Frontier"
 GRAND_PROTECTORATE_CONFIRM_BUTTON_TT: "Assign all checked kingdoms to this Grand Protectorate's de jure empire. Any unchecked former kingdoms safely return to their ancestral mother empires."
