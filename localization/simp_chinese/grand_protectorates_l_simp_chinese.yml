l_simp_chinese:
 # ====================================================================
 # CK3 Grand Protectorates - Simplified Chinese Localization
 # 天子敕建大都护府 - 简体中文本地化
 # ====================================================================

 # --- 三大帝国级大都护府头衔 ---
 e_anxi_protectorate: "安西大都护府"
 e_anxi_protectorate_adj: "安西"
 e_andong_protectorate: "安东大都护府"
 e_andong_protectorate_adj: "安东"
 e_anbei_protectorate: "安北大都护府"
 e_anbei_protectorate_adj: "安北"

 # --- 决议本地化（统一开府与更勘决议） ---
 establish_grand_protectorate_decision: "天子敕建：大都护府事务"
 establish_grand_protectorate_decision_desc: "大都护府者，天子总摄八荒、治兵抚夷之重地也。圣躬应运，抚平荒徼，当依古制于四裔设安西、安东、安北大都护府，立都护行省契约，行总督委任法，以镇藩服。已有大都护府亦可随时更勘其统摄疆界与法理归属。"
 establish_grand_protectorate_decision_tooltip: "敕建或更勘大都护府"
 establish_grand_protectorate_decision_effect_tooltip: "开启大都护府政务院面板，定夺该大都护府之法理辖区王国"

 ESTABLISH_GRAND_PROTECTORATE_NEXT_STEP_BUTTON: "拟定敕令"
 establish_decision_confirm: "颁诏定策"

 # 选项列表
 establish_anxi_option: "设安西大都护府"
 establish_anxi_option_desc: "在西域开建安西大都护府（法理首都：高昌），统摄河中、吐火罗及西域诸邦。"
 manage_anxi_option: "管理安西大都护府"
 manage_anxi_option_desc: "更勘调整安西大都护府所统辖之西域各王国法理辖区。"

 establish_andong_option: "设安东大都护府"
 establish_andong_option_desc: "在辽东开建安东大都护府（法理首都：沈阳），统摄辽东、朝鲜半岛及扶桑诸邦。"
 manage_andong_option: "管理安东大都护府"
 manage_andong_option_desc: "更勘调整安东大都护府所统辖之辽东及东海各王国法理辖区。"

 establish_anbei_option: "设安北大都护府"
 establish_anbei_option_desc: "在漠北开建安北大都护府（法理首都：哈喇和林），统摄大漠南北及极北草原诸部。"
 manage_anbei_option: "管理安北大都护府"
 manage_anbei_option_desc: "更勘调整安北大都护府所统辖之大漠草原各王国法理辖区。"

 # 伯爵领枢纽触发器提示
 unlock_anxi_protectorate_trigger_desc: "控制高昌伯爵领"
 unlock_andong_protectorate_trigger_desc: "控制沈阳伯爵领"
 unlock_anbei_protectorate_trigger_desc: "控制哈喇和林草原伯爵领"

 # --- 通知与横幅提示 ---
 grand_protectorate_opened_toast_title: "天子诏令：开府更勘"
 grand_protectorate_opened_toast_desc: "圣躬已宣旨定策，大都护府政务院即刻更勘辖内诸王国法理归属。"
 grand_protectorate_confirmed_toast_title: "天子敕定封疆"
 grand_protectorate_confirmed_toast_desc: "大都护府辖区更勘敕令已行布海内，诸王国法理已即时更定成制！"
 grand_protectorate_decommissioned_toast_title: "大都护府正式裁撤"
 grand_protectorate_decommissioned_toast_desc: "因辖区尽数清空，该大都护府已被正式裁撤，其原属王国法理已悉数归复其母帝国，并返还部分朝廷威望。"

 # --- 界面 UI 文本 ---
 GRAND_PROTECTORATE_WINDOW_HEADER: "大都护府政务院 · 辖区管辖更勘"
 GRAND_PROTECTORATE_PANEL_SUBHEADER: "天朝天子敕建之五级帝国疆理，行都护行省契约与总督委任法"
 GRAND_PROTECTORATE_INSTRUCTIONS: "请在下方列表中勾选划入该大都护府的王国。若清空勾选，将触发裁撤程序。"
 GRAND_PROTECTORATE_NO_CANDIDATE_KINGDOMS: "暂无符合设府或更勘条件的候选王国。"
 GRAND_PROTECTORATE_CARD_SUBTITLE: "母帝国：[Title.MakeScope.Var('display_original_empire').Title.GetNameNoTooltip] · 辖 [Title.MakeScope.Var('de_jure_duchy_count').GetValue|0] 公国"
 GRAND_PROTECTORATE_STATUS_ESTABLISHED: "【现辖法理】"
 GRAND_PROTECTORATE_DECOMMISSION_WARNING: "@warning_icon! 辖区已清空，该大都护府将被正式裁撤"
 GRAND_PROTECTORATE_BUTTON_CANCEL: "放弃更改"
 GRAND_PROTECTORATE_CONFIRM_BUTTON: "【颁布天子敕令：更勘疆理】"
 GRAND_PROTECTORATE_CONFIRM_BUTTON_TT: "将当前勾选的所有王国划归该大都护府法理；未勾选的已辖王国将安全退还母帝国法理。"
